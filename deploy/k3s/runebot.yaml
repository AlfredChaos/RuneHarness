# runebot 服务端 k3s 清单（ns nanobot）。可直接 apply。
#
# 镜像：多阶段构建（见根目录 Dockerfile），产物为静态二进制 + alpine 运行时。
# bangkok 已装 docker（v28）但无 go，构建在 bangkok 本机做：
#   git archive HEAD | ssh bangkok "mkdir -p ~/runebot-src && tar -x -C ~/runebot-src"
#   # 或 git clone 后取源码
#   ssh bangkok "cd ~/runebot-src && docker build -t runebot:mig1 ."
#   ssh bangkok "docker save runebot:mig1 | sudo k3s ctr images import -"
# ctr 默认导入 k8s.io namespace，containerd 可见后 apply（imagePullPolicy: Never）。
# tag 约定沿用现有 runebot:e2e 的 <名称>:<阶段> 风格，mig1 = 迁移第一版。
#
# 权限注意：镜像 USER rune（uid 1000），而 hostPath /home/ubuntu/runebot-data
# 现有文件属 root——apply 前 chown -R 1000:1000 /home/ubuntu/runebot-data，
# 否则进程写 sessions.db/memory.db 报权限错。
#
# 模型端点（Secret runebot-env 的 OPENAI_BASE_URL，不入库）：MiniMax 必须用
# https://api.minimaxi.com/v1，不要用 api.minimax.cn。同一把 key、同一请求，
# 从 bangkok 实测：.cn 上传 300KB 请求体 34.6s，.com 0.57s（.cn 的 DNS 回国内
# 5 个 IP，对曼谷是跨境慢链路）。文本请求体几百字节感觉不到，带图（数百 KB～MB 级
# base64）就整轮撞 120s requestTimeout。切换：kubectl -n nanobot patch secret
# runebot-env --type merge -p '{"stringData":{"OPENAI_BASE_URL":"..."}}' 后
# rollout restart（env 只在启动时读）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runebot
  namespace: nanobot
  labels:
    app: runebot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runebot
  template:
    metadata:
      labels:
        app: runebot
    spec:
      containers:
      - name: runebot
        image: runebot:soul3
        imagePullPolicy: Never
        ports:
        - containerPort: 18765
          protocol: TCP
        env:
        # 旧 pod 实际监听 0.0.0.0:18765，但该值既不在 Secret 也不在旧镜像
        # env 里，来源不可考；这里显式钉死，进程内默认 127.0.0.1:8765 不可达。
        - name: RUNE_LISTEN
          value: 0.0.0.0:18765
        # 数据目录：hostPath /home/ubuntu/runebot-data → /data。
        # HOME 指到 /data 使 skills 扫描、~/.rune 派生路径与旧部署一致；
        # 两个 DB 显式落 /data 根（与旧部署相同）。
        - name: HOME
          value: /data
        - name: RUNE_DB
          value: /data/sessions.db
        - name: RUNE_MEMORY_DB
          value: /data/memory.db
        # 人设外挂：SOUL.md 放在 hostPath 数据目录里，由部署方维护；
        # 文件不存在时进程行为与不带人设一致（internal/prompt.LoadSoul）。
        - name: RUNE_SOUL
          value: /data/SOUL.md
        # 陪伴画像（internal/memory/profile.go）：persona/bond/expression/
        # boundary 四类 AlwaysInject、subject 空间、dream 120min；不设走 generic 不适配。
        - name: RUNE_MEMORY_PROFILE
          value: companion
        # 采样参数（实验确定）：M3.1-Flash + 高思考、8K 完成预算，压掉 M3 上
        # 92% 回复把 <think> 内联到正文的问题；温度/top_p 走端点默认。
        - name: OPENAI_MODEL
          value: MiniMax-M3.1-Flash-Preview
        - name: RUNE_REASONING_EFFORT
          value: "high"
        - name: RUNE_MAX_COMPLETION_TOKENS
          value: "8192"
        # 定时任务开关：RUNE_CRON 修通了 cfg.Cron→调度器点火的链路，
        # 显式开。secret 里的 RUNE_CRON=false 被 env 段覆盖（同名键 env 优先）。
        - name: RUNE_CRON
          value: "true"
        envFrom:
        - secretRef:
            name: runebot-env
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            # poppler 渲染 PDF 页峰值 ~100-150MB/进程，并发闸限 2；512Mi 太紧。
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        hostPath:
          path: /home/ubuntu/runebot-data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: runebot
  namespace: nanobot
spec:
  selector:
    app: runebot
  ports:
  - name: http
    port: 80
    targetPort: 18765
---
# bear.alfred-develop.online 整域接管：nanobot-ws、bear-sidecar 两个旧后端已
# 永久删除（整体切换，非共存），/ 与 /svc 不再指向它们。runebot 网关自身
# serve /v1/*、/svc/*（gateway.go routes()）与 /ws（bear 轨），单条 "/" Prefix
# 全部收进来。TLS 证书沿用 cloudflare-origin-tls。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bear-ws
  namespace: nanobot
  annotations:
    # 图片附件走 base64 JSON 提交：默认 1m 会把真实照片（≈4-8MB/张）拦在
    # nginx 层，与 runeclient 端 ≤6MB/张 的软上限对不上；放宽到 40m。
    nginx.ingress.kubernetes.io/proxy-body-size: "40m"
spec:
  ingressClassName: nginx
  rules:
  - host: bear.alfred-develop.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: runebot
            port:
              number: 80
  tls:
  - hosts:
    - bear.alfred-develop.online
    secretName: cloudflare-origin-tls
